<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Agrosoft - Plataforma de gestión agrícola">
    <meta name="theme-color" content="rgba(50, 98, 33, 1)">
    <link rel="stylesheet" href="style.css">
    <title>Agrosoft - Iniciar Sesión</title>
</head>
<body>
    <div class="cuadro">
        <img src="/img/logo1.png" alt="Logo Agrosoft 1" class="logo1">
        <img src="/img/logo2.png" alt="Logo Agrosoft 2" class="logo2">
        <img src="/img/logo 3.png" alt="Logo Agrosoft" class="logo-centrado">
        
        <h2>AGROSOFT</h2>
        
        <div class="containboton">
            <a href="/k/dashboard.html" class="botonA">Iniciar Sesión</a>
            <a href="registrar.html" class="boton">Registrarme</a>
        </div>
        
        <label>Correo Electrónico</label>
        <div class="icono">
            <img src="/img/Mail.png" alt="Icono correo">
            <input type="email" placeholder="usuario@ejemplo.com">
        </div>
        
        <label>Contraseña</label>
        <div class="icono">
            <img src="/img/Lock.png" alt="Icono contraseña">
            <input type="password" placeholder="••••••••">
        </div>
        
        <a href="./k/dashboard.html" class="crearcuenta">Iniciar Sesión</a>
        <a href="recuperar.html" class="recuperar">¿Recuperar Contraseña?</a>
    </div>
</body>
</html>
