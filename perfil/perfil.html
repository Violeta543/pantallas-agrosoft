<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stlo.css">
    <title>Perfil Agrosoft - Yonatan Gomez</title>
</head>
<body>
    <div class="cuadrotransparente">
        <div class="contenedor">
            <div class="encabezado">
                <div class="foto">
                    <img src="img/perfil.png" alt="Foto de perfil">
                </div>
                <div class="marca">
                    <div class="marca-superior">
                        <img src="img/lo.png" alt="Logo Agrosoft">
                        <h3>AGROSOFT</h3>
                    </div>
                    <p>yonatan gomez</p>
                    <div class="rol">ADMINISTRADOR</div>
                </div>
            </div>

            <div class="campos">
                <div class="campo">
                    <img src="img/User.png" alt="Icono nombre">
                    <div class="campo-contenido">
                        <span class="campo-titulo">Nombre</span>
                        <span class="campo-valor">yonatan administrador</span>
                    </div>
                </div>
                <div class="campo">
                    <img src="img/Mail.png" alt="Icono correo">
                    <div class="campo-contenido">
                        <span class="campo-titulo">Correo Electrónico</span>
                        <span class="campo-valor">admin@agro.com</span>
                    </div>
                </div>
                <div class="campo">
                    <img src="img/Lock.png" alt="Icono contraseña">
                    <div class="campo-contenido">
                        <span class="campo-titulo">Contraseña</span>
                        <span class="campo-valor">••••••••</span>
                    </div>
                </div>
                <div class="campo">
                    <img src="img/Phone.png" alt="Icono teléfono">
                    <div class="campo-contenido">
                        <span class="campo-titulo">Teléfono</span>
                        <span class="campo-valor">3134727022</span>
                    </div>
                </div>
            </div>

            <a class="boton-editar" href="#">Editar Perfil</a>

            <div class="nav-inferior">
                <a href="#" class="nav-ajustes">
                    <img src="img/ajustes.png" alt="Ajustes">
                    <span>Ajustes</span>
                </a>
                <a href="#" class="nav-inicio">
                    <img src="img/lo.png" alt="Inicio">
                    <span>Inicio</span>
                </a>
                <a href="#" class="nav-perfil">
                    <img src="img/User.png" alt="Perfil">
                    <span>Perfil</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
