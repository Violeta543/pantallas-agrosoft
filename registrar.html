<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Agrosoft - Registro de nueva cuenta">
    <meta name="theme-color" content="rgba(50, 98, 33, 1)">
    <link rel="stylesheet" href="style.css">
    <title>Agrosoft - Registrarse</title>
</head>
<body>
    <div class="cuadro2">
        <img src="/img/logo1.png" alt="Logo Agrosoft 1" class="logo1">
        <img src="/img/logo2.png" alt="Logo Agrosoft 2" class="logo2">
        <img src="/img/logo 3.png" alt="Logo Agrosoft" class="logo-centrado">
        
        <h2>AGROSOFT</h2>
        
        <div class="containboton">
            <a href="index.html" class="boton">Iniciar Sesión</a>
            <a href="#" class="botonA">Registrarme</a>
        </div>
        
        <label>Nombre Completo</label>
        <div class="icono">
            <img src="/img/Person.png" alt="Icono persona">
            <input type="text" placeholder="Juan Pérez">
        </div>
        
        <label>Correo Electrónico</label>
        <div class="icono">
            <img src="/img/Mail.png" alt="Icono correo">
            <input type="email" placeholder="usuario@ejemplo.com">
        </div>
        
        <label>Contraseña</label>
        <div class="icono">
            <img src="/img/Lock.png" alt="Icono contraseña">
            <input type="password" placeholder="••••••••">
        </div>
        
        <a href="#" class="crearcuenta">Crear Cuenta</a>
        <a href="index.html" class="recuperar">Ya Tengo Cuenta</a>
    </div>
</body>
</html>
